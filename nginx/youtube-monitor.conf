server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /home/cwoollard/youtube-monitor/reports;
    index youtube_channel_report.html;

    charset utf-8;

    # Main multi-creator dashboard
    location = / {
        try_files /youtube_channel_report.html =404;
        add_header Cache-Control "no-store";
    }

    # Main dashboard HTML
    location = /youtube_channel_report.html {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Individual creator reports
    location ~ ^/channel-[a-z0-9_-]+\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # Deny everything else
    location / {
        return 404;
    }

    access_log /var/log/nginx/youtube-monitor-access.log;
    error_log /var/log/nginx/youtube-monitor-error.log;
}
